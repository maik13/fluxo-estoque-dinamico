name: Temporary preservar gestor config

on:
  push:
    branches:
      - feature/configuracoes-na-lateral-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gestor-config-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configuracoes-na-lateral-20260910
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Preservar acesso legado do Gestor
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/Index.tsx')
          s = p.read_text()
          old = "    canManageStock,\n    canManageSettings,\n    canAccessManagerial,"
          new = "    isGestor,\n    canManageStock,\n    canManageSettings,\n    canAccessManagerial,"
          if s.count(old) != 1:
              raise SystemExit('destructuring inesperado')
          s = s.replace(old, new, 1)
          old = "          const showConfiguracoes = canManageSettings();"
          new = "          const showConfiguracoes = isGestor() || canManageSettings();"
          if s.count(old) != 1:
              raise SystemExit('regra showConfiguracoes inesperada')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: bun install --frozen-lockfile
      - run: git diff --check
      - run: bunx eslint src/pages/Index.tsx src/components/gestao-estoque/NavegacaoLateralEstoque.tsx
      - run: bun run build
      - run: bun run test
      - name: Commitar
        run: |
          git config user.name "ChatGPT Validation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Index.tsx
          git commit -m "[gestor-config-bot] fix: preservar acesso de gestor às configurações"
          git push origin HEAD:feature/configuracoes-na-lateral-20260910
