name: Temporary dashboard validation

on:
  push:
    branches:
      - feature/visao-geral-almoxarifado-20260910

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without mutating lockfile
        run: npm install --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test
