name: Temporary OP nome voz impressao

on:
  push:
    branches:
      - feature/op-nome-voz-impressao-20260910

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[op-nome-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/op-nome-voz-impressao-20260910
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Aplicar integração nominal da OP
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 ocorrência, encontrado {count}')
              p.write_text(s.replace(old, new, 1))

          # Tipos: a OP passa a carregar a atividade principal e seu snapshot nominal.
          replace_once(
              'src/types/producao.ts',
              "  projeto_nome: string; projeto_cidade: string | null; projeto_uf: string | null; local_tipo: ProducaoLocalTipo;\n",
              "  projeto_nome: string; projeto_cidade: string | null; projeto_uf: string | null; tarefa_id: string | null; tarefa_nome_snapshot: string | null; local_tipo: ProducaoLocalTipo;\n",
              'tipo OP atividade',
          )
          replace_once(
              'src/types/producao.ts',
              "  processo_id: string; quantidade_planejada: number; data_inicio_prevista: string; data_fim_prevista: string;\n",
              "  processo_id: string; tarefa_id: string; quantidade_planejada: number; data_inicio_prevista: string; data_fim_prevista: string;\n",
              'nova OP atividade',
          )

          # Hook canônico de OPs.
          p = Path('src/hooks/useOrdensProducao.ts')
          s = p.read_text()
          s = s.replace('criar_ordem_producao_sem_limite_v2|schema cache|could not find the function', 'criar_ordem_producao_sem_limite_v3|schema cache|could not find the function')
          s = s.replace('20260806112000_criar_ordem_producao_sem_limite_v2.sql', '20260910160500_op_atividade_nome_v1.sql')
          s = s.replace('editar_ordem_producao_v1|schema cache|could not find the function', 'editar_ordem_producao_v2|schema cache|could not find the function')
          s = s.replace('20260806115500_editar_ordem_producao_v1.sql', '20260910160500_op_atividade_nome_v1.sql')
          s = s.replace("  justificativa: string;\n}", "  justificativa: string;\n  tarefa_id?: string | null;\n}", 1)
          s = s.replace("(supabase.rpc as any)('editar_ordem_producao_v1', {", "(supabase.rpc as any)('editar_ordem_producao_v2', {")
          s = s.replace("    p_justificativa: dados.justificativa,\n  });", "    p_justificativa: dados.justificativa,\n    p_tarefa_id: dados.tarefa_id ?? null,\n  });", 1)
          s = s.replace("export const formatarNumeroOrdemProducao = (numero: number | null | undefined) =>\n  numero ? `OP ${String(numero).padStart(6, '0')}` : 'OP sem número';\n", "export const formatarNumeroOrdemProducao = (numero: number | null | undefined) =>\n  numero ? `OP ${String(numero).padStart(6, '0')}` : 'OP sem número';\n\nexport const formatarIdentificacaoOrdemProducao = (ordem: {\n  numero: number | null | undefined;\n  tarefa_nome_snapshot?: string | null;\n} | null | undefined) => {\n  const numero = formatarNumeroOrdemProducao(ordem?.numero);\n  const atividade = ordem?.tarefa_nome_snapshot?.trim();\n  return atividade ? `${numero} — ${atividade}` : numero;\n};\n")
          s = s.replace("(supabase.rpc as any)('listar_ordens_producao', {", "(supabase.rpc as any)('listar_ordens_producao_v2', {")
          s = s.replace("      'criar_ordem_producao_sem_limite_v2',", "      'criar_ordem_producao_sem_limite_v3',")
          s = s.replace("        p_processo_id: dados.processo_id,\n        p_quantidade_planejada:", "        p_processo_id: dados.processo_id,\n        p_tarefa_id: dados.tarefa_id,\n        p_quantidade_planejada:")
          p.write_text(s)

          # Produção já carrega tarefas; reaproveitar a mesma fonte na aba Etapas.
          replace_once(
              'src/components/producao/Producao.tsx',
              '<TabsContent value="etapas" className="mt-5"><ProcessosProducao /></TabsContent>',
              '<TabsContent value="etapas" className="mt-5"><ProcessosProducao tarefas={tarefas} /></TabsContent>',
              'passar tarefas para etapas',
          )

          # Emissão da OP: atividade obrigatória + descrição com voz.
          p = Path('src/components/producao/FormOrdemProducao.tsx')
          s = p.read_text()
          s = s.replace("import { Textarea } from '@/components/ui/textarea';", "import { Textarea } from '@/components/ui/textarea';\nimport { CampoDescricaoComVoz } from './CampoDescricaoComVoz';")
          s = s.replace("  ProducaoProcesso,\n} from '@/types/producao';", "  ProducaoProcesso,\n  ProducaoTarefa,\n} from '@/types/producao';")
          s = s.replace("  ordens: ProducaoOrdemProducao[];\n  onEmitir:", "  ordens: ProducaoOrdemProducao[];\n  tarefas: ProducaoTarefa[];\n  onEmitir:")
          s = s.replace("export const FormOrdemProducao = ({ processo, ordens, onEmitir }: Props) => {", "export const FormOrdemProducao = ({ processo, ordens, tarefas, onEmitir }: Props) => {")
          s = s.replace("  const [quantidade, setQuantidade] = useState('');", "  const [quantidade, setQuantidade] = useState('');\n  const [tarefaId, setTarefaId] = useState('');")
          s = s.replace("    setQuantidade('');\n    setInicio(", "    setQuantidade('');\n    setTarefaId('');\n    setInicio(", 1)
          s = s.replace("    const quantidadeNormalizada = numero(quantidade);", "    const quantidadeNormalizada = numero(quantidade);\n    if (!tarefaId) {\n      toast.error('Selecione a atividade que dará nome à OP.');\n      return;\n    }")
          s = s.replace("        processo_id: processo.id,\n        quantidade_planejada:", "        processo_id: processo.id,\n        tarefa_id: tarefaId,\n        quantidade_planejada:")
          s = s.replace("      setQuantidade('');\n      setDescricao('');", "      setQuantidade('');\n      setTarefaId('');\n      setDescricao('');")
          marker = "          <div className=\"grid gap-4 sm:grid-cols-2\">\n            <div className=\"space-y-2\">\n              <Label>Quantidade desta OP *</Label>"
          replacement = "          <div className=\"grid gap-4 sm:grid-cols-2\">\n            <div className=\"space-y-2 sm:col-span-2\">\n              <Label>Atividade / nome da OP *</Label>\n              <Select value={tarefaId} onValueChange={setTarefaId}>\n                <SelectTrigger>\n                  <SelectValue placeholder=\"Selecione a atividade que identificará esta OP\" />\n                </SelectTrigger>\n                <SelectContent>\n                  {tarefas.filter((tarefa) => tarefa.ativo).map((tarefa) => (\n                    <SelectItem key={tarefa.id} value={tarefa.id}>\n                      {tarefa.nome}\n                    </SelectItem>\n                  ))}\n                </SelectContent>\n              </Select>\n              <p className=\"text-xs text-muted-foreground\">\n                O número continuará sendo gerado automaticamente. Esta atividade ficará gravada como o nome da OP.\n              </p>\n            </div>\n            <div className=\"space-y-2\">\n              <Label>Quantidade desta OP *</Label>"
          if marker not in s:
              raise SystemExit('form OP: bloco quantidade não encontrado')
          s = s.replace(marker, replacement, 1)
          old_desc = "          <div className=\"space-y-2\">\n            <Label>Descrição do lote</Label>\n            <Input\n              value={descricao}\n              onChange={(event) => setDescricao(event.target.value)}\n              placeholder=\"Ex.: primeiro lote de laços ou segundo lote de painéis\"\n            />\n          </div>"
          new_desc = "          <div className=\"space-y-2\">\n            <Label>Descrição</Label>\n            <CampoDescricaoComVoz\n              value={descricao}\n              onChange={setDescricao}\n              placeholder=\"Descreva de forma objetiva o que deve ser executado nesta OP.\"\n              rows={4}\n            />\n          </div>"
          if old_desc not in s:
              raise SystemExit('form OP: descrição não encontrada')
          s = s.replace(old_desc, new_desc, 1)
          p.write_text(s)

          # Edição: preserva atividade já definida e oferece ditado na descrição.
          p = Path('src/components/producao/FormEditarOrdemProducao.tsx')
          s = p.read_text()
          s = s.replace("import { Textarea } from '@/components/ui/textarea';", "import { Textarea } from '@/components/ui/textarea';\nimport { CampoDescricaoComVoz } from './CampoDescricaoComVoz';")
          s = s.replace("        justificativa: motivo,\n      });", "        justificativa: motivo,\n        tarefa_id: ordem.tarefa_id,\n      });")
          s = s.replace("            <p>\n              <strong>Produção confirmada:</strong>", "            <p>\n              <strong>Atividade da OP:</strong>{' '}\n              {ordem.tarefa_nome_snapshot ?? 'Ainda não vinculada'}\n            </p>\n            <p>\n              <strong>Produção confirmada:</strong>")
          old_edit_desc = "          <div className=\"space-y-2\">\n            <Label>Descrição do lote</Label>\n            <Input\n              value={descricao}\n              onChange={(event) => setDescricao(event.target.value)}\n            />\n          </div>"
          new_edit_desc = "          <div className=\"space-y-2\">\n            <Label>Descrição</Label>\n            <CampoDescricaoComVoz\n              value={descricao}\n              onChange={setDescricao}\n              placeholder=\"Descreva de forma objetiva o que deve ser executado nesta OP.\"\n              rows={4}\n            />\n          </div>"
          if old_edit_desc not in s:
              raise SystemExit('editar OP: descrição não encontrada')
          s = s.replace(old_edit_desc, new_edit_desc, 1)
          p.write_text(s)

          # Etapas: exibir nome da OP e oferecer impressão operacional.
          p = Path('src/components/producao/ProcessosProducao.tsx')
          s = p.read_text()
          s = s.replace("  Pause,\n  Play,", "  Pause,\n  Play,\n  Printer,")
          s = s.replace("  formatarNumeroOrdemProducao,\n} from '@/hooks/useOrdensProducao';", "  formatarNumeroOrdemProducao,\n  formatarIdentificacaoOrdemProducao,\n} from '@/hooks/useOrdensProducao';")
          s = s.replace("  ProducaoOrdemProducao,\n  ProducaoProcesso,", "  ProducaoOrdemProducao,\n  ProducaoProcesso,\n  ProducaoTarefa,")
          s = s.replace("} from '@/types/producao';\n", "} from '@/types/producao';\nimport { imprimirOrdemProducaoOperacional } from '@/utils/imprimirOrdemProducaoOperacional';\n", 1)
          s = s.replace("export const ProcessosProducao = () => {", "interface Props {\n  tarefas: ProducaoTarefa[];\n}\n\nexport const ProcessosProducao = ({ tarefas }: Props) => {")
          s = s.replace("                        ordens={ordens}\n                        onEmitir={criarOrdem}", "                        ordens={ordens}\n                        tarefas={tarefas}\n                        onEmitir={criarOrdem}")
          s = s.replace("                                  {formatarNumeroOrdemProducao(ordem.numero)}\n", "                                  {formatarIdentificacaoOrdemProducao(ordem)}\n", 1)
          action_marker = "                            <div className=\"flex flex-wrap gap-2\">\n                              {['liberada', 'em_execucao'].includes("
          action_replacement = "                            <div className=\"flex flex-wrap gap-2\">\n                              <Button\n                                size=\"sm\"\n                                variant=\"outline\"\n                                onClick={() => {\n                                  try {\n                                    imprimirOrdemProducaoOperacional(ordem);\n                                  } catch (error) {\n                                    toast.error(mensagemErro(error, 'Não foi possível imprimir a OP.'));\n                                  }\n                                }}\n                              >\n                                <Printer className=\"mr-2 h-4 w-4\" />\n                                Imprimir OP\n                              </Button>\n                              {['liberada', 'em_execucao'].includes("
          if action_marker not in s:
              raise SystemExit('etapas: bloco de ações da OP não encontrado')
          s = s.replace(action_marker, action_replacement, 1)
          # Também leva o nome para modais e mensagens quando há o objeto completo.
          s = s.replace("${formatarNumeroOrdemProducao(ordem.numero)} finalizada.", "${formatarIdentificacaoOrdemProducao(ordem)} finalizada.")
          s = s.replace("${formatarNumeroOrdemProducao(ordem.numero)} iniciada.", "${formatarIdentificacaoOrdemProducao(ordem)} iniciada.")
          s = s.replace("{formatarNumeroOrdemProducao(acaoPendente.ordem.numero)}", "{formatarIdentificacaoOrdemProducao(acaoPendente.ordem)}")
          p.write_text(s)

          # Apontamento: a OP sugere automaticamente sua atividade principal.
          p = Path('src/components/producao/FormApontamentoProducaoV2.tsx')
          s = p.read_text()
          s = s.replace("import { useOrdensProducao, formatarNumeroOrdemProducao } from '@/hooks/useOrdensProducao';", "import { useOrdensProducao, formatarNumeroOrdemProducao, formatarIdentificacaoOrdemProducao } from '@/hooks/useOrdensProducao';")
          s = s.replace("    setProjetoLocalId('');\n    setLocalTipo(ordemSelecionada.local_tipo);", "    setProjetoLocalId('');\n    setLocalTipo(ordemSelecionada.local_tipo);\n    setTarefaId(ordemSelecionada.tarefa_id ?? '');")
          s = s.replace("? ` dentro da ${formatarNumeroOrdemProducao(ordemSelecionada.numero)}`", "? ` dentro da ${formatarIdentificacaoOrdemProducao(ordemSelecionada)}`")
          s = s.replace("{formatarNumeroOrdemProducao(ordem.numero)} · {ordem.processo_nome} · {ordem.projeto_nome}", "{formatarIdentificacaoOrdemProducao(ordem)} · {ordem.processo_nome} · {ordem.projeto_nome}")
          s = s.replace("<p><strong>{formatarNumeroOrdemProducao(ordemSelecionada.numero)}</strong> · {ordemSelecionada.status === 'liberada' ? 'Liberada' : 'Em execução'}</p>", "<p><strong>{formatarIdentificacaoOrdemProducao(ordemSelecionada)}</strong> · {ordemSelecionada.status === 'liberada' ? 'Liberada' : 'Em execução'}</p>")
          p.write_text(s)

          # Cronograma: enriquecer as OPs com sua identidade nominal.
          p = Path('src/hooks/useCronogramaProducao.ts')
          s = p.read_text()
          s = s.replace("  numero: number;\n  status: string;", "  numero: number;\n  tarefa_id: string | null;\n  tarefa_nome_snapshot: string | null;\n  status: string;")
          old_promise = "      const [{ data, error }, configResult, alertasResult] = await Promise.all([\n        (supabase.rpc as any)('listar_gantt_producao'),\n        supabase.from('producao_cronograma_configuracoes').select('equipe_disponivel_por_dia,trabalha_sabado,trabalha_domingo,horizonte_dias').eq('id', 1).maybeSingle(),\n        supabase.from('producao_cronograma_alertas').select('id,processo_id,data,severidade,codigo,mensagem').order('created_at', { ascending: false }).limit(100),\n      ]);"
          new_promise = "      const [{ data, error }, configResult, alertasResult, ordensResult] = await Promise.all([\n        (supabase.rpc as any)('listar_gantt_producao'),\n        supabase.from('producao_cronograma_configuracoes').select('equipe_disponivel_por_dia,trabalha_sabado,trabalha_domingo,horizonte_dias').eq('id', 1).maybeSingle(),\n        supabase.from('producao_cronograma_alertas').select('id,processo_id,data,severidade,codigo,mensagem').order('created_at', { ascending: false }).limit(100),\n        (supabase.rpc as any)('listar_ordens_producao_v2', { p_processo_id: null, p_status: null }),\n      ]);"
          if old_promise not in s:
              raise SystemExit('cronograma hook: Promise.all não encontrado')
          s = s.replace(old_promise, new_promise, 1)
          s = s.replace("      if (alertasResult.error) throw new Error(formatarErroSupabase(alertasResult.error, 'Não foi possível carregar os alertas do cronograma.'));\n\n      const resultado", "      if (alertasResult.error) throw new Error(formatarErroSupabase(alertasResult.error, 'Não foi possível carregar os alertas do cronograma.'));\n      if (ordensResult.error) throw new Error(formatarErroSupabase(ordensResult.error, 'Não foi possível carregar os nomes das OPs.'));\n\n      const identidadePorOp = new Map<string, { tarefa_id: string | null; tarefa_nome_snapshot: string | null }>(\n        ((ordensResult.data ?? []) as Array<{ id: string; tarefa_id: string | null; tarefa_nome_snapshot: string | null }>).map((ordem) => [\n          ordem.id,\n          { tarefa_id: ordem.tarefa_id, tarefa_nome_snapshot: ordem.tarefa_nome_snapshot },\n        ]),\n      );\n\n      const resultado")
          old_map = "        const ordens = ordensOriginais.map((ordem) => ({\n          ...ordem,\n          // No Gantt, a posição da OP é definida pela própria programação da OP.\n          // Datas reais/status não substituem início planejado e prazo da OP.\n          data_inicio_real: null,\n          data_fim_real: null,\n        }));"
          new_map = "        const ordens = ordensOriginais.map((ordem) => {\n          const identidade = identidadePorOp.get(ordem.id);\n          return {\n            ...ordem,\n            tarefa_id: identidade?.tarefa_id ?? ordem.tarefa_id ?? null,\n            tarefa_nome_snapshot: identidade?.tarefa_nome_snapshot ?? ordem.tarefa_nome_snapshot ?? null,\n            // No Gantt, a posição da OP é definida pela própria programação da OP.\n            // Datas reais/status não substituem início planejado e prazo da OP.\n            data_inicio_real: null,\n            data_fim_real: null,\n          };\n        });"
          if old_map not in s:
              raise SystemExit('cronograma hook: map de OPs não encontrado')
          s = s.replace(old_map, new_map, 1)
          p.write_text(s)

          p = Path('src/components/producao/CronogramaProducao.tsx')
          s = p.read_text()
          s = s.replace("import { formatarNumeroOrdemProducao } from '@/hooks/useOrdensProducao';", "import { formatarIdentificacaoOrdemProducao, formatarNumeroOrdemProducao } from '@/hooks/useOrdensProducao';")
          s = s.replace("          formatarNumeroOrdemProducao(ordem.numero),\n          ordem.local_tipo,", "          formatarNumeroOrdemProducao(ordem.numero),\n          ordem.tarefa_nome_snapshot,\n          ordem.local_tipo,")
          s = s.replace("↳ {formatarNumeroOrdemProducao(linha.ordem.numero)}", "↳ {formatarIdentificacaoOrdemProducao(linha.ordem)}")
          p.write_text(s)

          # Histórico: nome acompanha o número nos principais pontos de escolha e leitura.
          p = Path('src/components/producao/HistoricoApontamentosProducaoV2.tsx')
          s = p.read_text()
          s = s.replace("  formatarNumeroOrdemProducao,\n} from '@/hooks/useOrdensProducao';", "  formatarNumeroOrdemProducao,\n  formatarIdentificacaoOrdemProducao,\n} from '@/hooks/useOrdensProducao';")
          s = s.replace("{formatarNumeroOrdemProducao(ordem.numero)} ·{' '}\n                      {ordem.processo_nome}", "{formatarIdentificacaoOrdemProducao(ordem)} ·{' '}\n                      {ordem.processo_nome}")
          s = s.replace("title={`Imprimir ${formatarNumeroOrdemProducao(ordem.numero)}`}", "title={`Imprimir ${formatarIdentificacaoOrdemProducao(ordem)}`}")
          s = s.replace("{formatarNumeroOrdemProducao(ordem.numero)}\n", "{formatarIdentificacaoOrdemProducao(ordem)}\n")
          p.write_text(s)

          # O relatório histórico detalhado também identifica nominalmente a OP no cabeçalho.
          p = Path('src/utils/imprimirOrdemProducao.ts')
          s = p.read_text()
          s = s.replace("  const localizacao = [ordem.projeto_cidade, ordem.projeto_uf].filter(Boolean).join('/');", "  const localizacao = [ordem.projeto_cidade, ordem.projeto_uf].filter(Boolean).join('/');\n  const atividadeOp = ordem.tarefa_nome_snapshot?.trim() || 'Atividade não vinculada';")
          s = s.replace("  <title>${escapar(opFormatada(ordem.numero))}</title>", "  <title>${escapar(`${opFormatada(ordem.numero)} — ${atividadeOp}`)}</title>")
          s = s.replace("  <h1>Ordem de Produção</h1>\n  <p class=\"descricao\">", "  <h1>${escapar(opFormatada(ordem.numero))} — ${escapar(atividadeOp)}</h1>\n  <p class=\"descricao\">")
          p.write_text(s)

          # Invariantes do bloco.
          checks = {
              'migration columns': 'tarefa_nome_snapshot' in Path('supabase/migrations/20260910160500_op_atividade_nome_v1.sql').read_text(),
              'auto number untouched': 'producao_ordem_numero_seq' not in Path('src/components/producao/FormOrdemProducao.tsx').read_text(),
              'activity required': 'Atividade / nome da OP *' in Path('src/components/producao/FormOrdemProducao.tsx').read_text(),
              'voice': 'CampoDescricaoComVoz' in Path('src/components/producao/FormOrdemProducao.tsx').read_text(),
              'print': 'imprimirOrdemProducaoOperacional' in Path('src/components/producao/ProcessosProducao.tsx').read_text(),
              'apontamento prefill': "setTarefaId(ordemSelecionada.tarefa_id ?? '')" in Path('src/components/producao/FormApontamentoProducaoV2.tsx').read_text(),
              'list v2': 'listar_ordens_producao_v2' in Path('src/hooks/useOrdensProducao.ts').read_text(),
              'create v3': 'criar_ordem_producao_sem_limite_v3' in Path('src/hooks/useOrdensProducao.ts').read_text(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Invariantes falharam: ' + ', '.join(failed))
          print('Invariantes OK')
          PY

      - run: bun install --frozen-lockfile
      - run: git diff --check
      - name: Lint do bloco
        run: bunx eslint src/components/producao/CampoDescricaoComVoz.tsx src/components/producao/FormOrdemProducao.tsx src/components/producao/FormEditarOrdemProducao.tsx src/components/producao/FormApontamentoProducaoV2.tsx src/components/producao/ProcessosProducao.tsx src/components/producao/Producao.tsx src/hooks/useOrdensProducao.ts src/hooks/useCronogramaProducao.ts src/components/producao/CronogramaProducao.tsx src/components/producao/HistoricoApontamentosProducaoV2.tsx src/utils/imprimirOrdemProducaoOperacional.ts
      - run: bun run build
      - run: bun run test
      - name: Commitar bloco validado
        run: |
          git config user.name "ChatGPT Validation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/migrations/20260910160500_op_atividade_nome_v1.sql
          git commit -m "[op-nome-bot] feat: nomear OP por atividade, ditar descrição e imprimir"
          git push origin HEAD:feature/op-nome-voz-impressao-20260910
