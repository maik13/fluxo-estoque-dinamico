name: Temporary sidebar validation

on:
  push:
    branches:
      - feature/navegacao-lateral-almoxarifado-20260910

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed files
        run: bunx eslint src/components/gestao-estoque/NavegacaoLateralEstoque.tsx src/pages/Index.tsx e2e/estoque.spec.ts
      - name: Build
        run: bun run build
      - name: Tests
        run: bun run test
